name: CI

on:
  pull_request:
  push:
    branches: [master]

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Integration tests skip themselves when .env.local is absent, so this
      # runs the unit suite only. See "Enabling integration tests in CI" in
      # docs/GAP_LIST.md before adding database secrets to a public repo.
      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build
        env:
          # The build must not require real credentials; these only satisfy
          # env validation for pages that are statically analysed.
          NEXT_PUBLIC_SITE_URL: http://localhost:3001
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
          SUPABASE_SECRET_KEY: ci-placeholder

      - name: Secret exposure scan
        run: node scripts/scan-secrets.js
        env:
          NEXT_PUBLIC_SITE_URL: http://localhost:3001
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
          SUPABASE_SECRET_KEY: ci-placeholder
